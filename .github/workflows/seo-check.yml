name: SEO Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  seo:
    name: Build and verify SEO endpoints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start app
        run: |
          nohup npm start > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -sS http://localhost:3000/robots.txt >/dev/null 2>&1; then
              echo "server up"
              break
            fi
            sleep 1
          done

      - name: Verify SEO endpoints
        run: |
          set -euo pipefail
          # fetch files
          curl -f -sS http://localhost:3000/robots.txt -o /tmp/robots.txt
          curl -f -sS http://localhost:3000/sitemap.xml -o /tmp/sitemap.xml
          curl -sS -I http://localhost:3000/opengraph-image | tr -d '\r' > /tmp/og_headers.txt

          # basic sanity checks
          echo "--- robots.txt ---"
          sed -n '1,120p' /tmp/robots.txt

          echo "--- sitemap.xml (first lines) ---"
          sed -n '1,40p' /tmp/sitemap.xml

          echo "--- opengraph-image headers ---"
          sed -n '1,120p' /tmp/og_headers.txt

          # assertions
          grep -q '<urlset' /tmp/sitemap.xml
          grep -q 'Sitemap:' /tmp/robots.txt
          grep -qi 'content-type: image/png' /tmp/og_headers.txt || (echo 'OG image did not return image/png' && exit 1)

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/next.pid ]; then
            kill $(cat /tmp/next.pid) || true
          fi
